<!DOCTYPE HTML>
<html>

<head>
  <meta charset="utf-8">
  <title>TinyWars Experimental</title>
  <meta name="viewport"
    content="width=device-width,initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="full-screen" content="true" />
  <meta name="screen-orientation" content="portrait" />
  <meta name="x5-fullscreen" content="true" />
  <meta name="360-fullscreen" content="true" />
  <meta name="description" content="The web version of Advance Wars: Days of Ruin / Dark Conflict.">
  <link rel="shortcut icon" href="/favicon.ico" type="image/x-icon">
  <link rel="icon" href="/favicon.ico" type="image/x-icon">

  <style>html,body{-ms-touch-action:none;background:#000;border:0;height:100%;margin:0;padding:0}#outLoadingLayer div{display:block}#outLoadingLayer{z-index:10000;width:100%;height:100%;position:absolute;top:0}#loadingLayer{background:#000;width:100%;height:100%}#logoDiv{padding-top:119px}.fullWidth{width:100%}#logoCon{background-position:50%;background-size:contain;width:244px;height:177px;margin:0 auto}#loadingContent{padding-top:20px}#loadingTxt{color:#b8b8b8;text-align:center;width:100%;font-family:微软雅黑;font-size:16px}#loadingBarCon{background:#343234;border-radius:4.52813px;width:237px;height:4px;margin:23px auto 0}#loadingBar{background:#fbd067;border-radius:4.52813px;width:237px;height:100%;margin:0}.addTransition{transform-origin:0 0;transform:scaleX(0)}.line-scale{transform-origin:0 0;transition:all 16s ease-in-out;transform:scale(1)}.clickme{color:#deb887}#TextInputContainer,#TransparentTouchLayer{pointer-events:none;width:100%;height:100%;position:fixed}</style>
  <script type="module" crossorigin src="/assets/index-Nxgq8Wbd.js"></script>
</head>

<body>
  <div style="margin: auto;width: 100%;height: 100%;" class="egret-player" data-entry-class="Main"
    data-orientation="auto" data-scale-mode="fixedWidth" data-frame-rate="60" data-content-width="960"
    data-content-height="540" data-show-paint-rect="false" data-multi-fingered="2" data-show-fps="false"
    data-show-log="false" data-show-fps-style="x:0,y:0,size:12,textColor:0xffffff,bgAlpha:0.9">
  </div>

  <div id="outLoadingLayer">
    <div id="loadingLayer">
      <div id="logoDiv" class="fullWidth">
        <div id="logoCon"></div>
      </div>
      <div id="loadingContent" class="fullWidth">
        <div id="loadingTxt">
          Welcome to the web version of Advance Wars: Days of Ruin.
          <font color="#f69638" size="1">
            <script>
              function sclick() {
                location.href = "";
              }
            </script>
            <span id="loadingDesTxt"><a class="clickme" href="javascript:sclick();">Now loading... Got
                stuck? Touch me to refresh<br></a></span>
          </font>
          欢迎游玩《高级战争：毁灭之日》网页版！
          <font color="#f69638" size="1">
            <script>
              function sclick() {
                location.href = "";
              }
            </script>
            <span id="loadingDesTxt"><a class="clickme" href="javascript:sclick();">游戏加载中……若卡住，请点我刷新<br></a></span>
          </font>
        </div>
        <div id="loadingBarCon">
          <div id="loadingBar" class="addTransition"></div>
        </div>
      </div>
    </div>
  </div>

  <div id="TextInputContainer"></div>
  <div id="TransparentTouchLayer"></div>

  <script>
    window.CLIENT_VERSION = "26.1026.2011";
    window.GAME_VERSION = "Test";
    window.TEXT_INPUT_CONTAINER = document.getElementById("TextInputContainer");
    window.TRANSPARENT_TOUCH_LAYER = document.getElementById("TransparentTouchLayer");

    {
      var isDown = false;
      var layer = document.getElementById("TransparentTouchLayer");
      layer.addEventListener("pointerup", function (e) {
        if (isDown) {
          isDown = false;
          layer.style.pointerEvents = "none";
        }
      });
      layer.addEventListener("pointerdown", function (e) {
        isDown = true;
      });
    }

    {
      const loadingBar = document.getElementById("loadingBar");
      // 先让浏览器计算初始 scale(0, 1) 状态
      loadingBar.getBoundingClientRect();
      // 再切换到目标状态，触发过渡
      loadingBar.className = "line-scale";
    }
  </script>
</body>

</html>
